name: Deploy ModelTrace web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Generate Nuxt SPA
        working-directory: web
        env:
          NUXT_APP_BASE_URL: /ModelTrace/
          NUXT_PUBLIC_PROXY_URL: https://llm-iq-proxy.hanmo5888.workers.dev/v1
        run: |
          npm ci
          npm run generate
          touch .output/public/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/.output/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: ModelTrace CLI tests
on:
  push:
    paths: ['modeltrace_cli.py', 'modeltrace_api.py', 'test_modeltrace_cli.py', 'fingerprint.py', 'data/unified_bank.json', '.github/workflows/cli-tests.yml']
  pull_request:
    paths: ['modeltrace_cli.py', 'modeltrace_api.py', 'test_modeltrace_cli.py', 'fingerprint.py', 'data/unified_bank.json', '.github/workflows/cli-tests.yml']
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_modeltrace_cli

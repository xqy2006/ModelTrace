<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器本地运行的语言模型指纹归因工具">
  <title>ModelTrace</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./repository-link.css">
</head>
<body>
  <header class="topbar">
    <div class="product-name"><span class="product-mark">MT</span><strong>ModelTrace</strong></div>
    <div class="topbar-actions">
      <div class="topbar-status"><span id="topbar-bank-count">正在加载指纹库</span></div>
      <a class="topbar-github" href="https://github.com/xqy2006/ModelTrace" target="_blank" rel="noopener noreferrer" aria-label="在新标签页打开 ModelTrace 的 GitHub 仓库" title="GitHub 仓库">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
    </div>
  </header>

  <main class="main-content static-main">
    <section class="workspace active">
      <div class="page-header">
        <h1>模型测试</h1>
        <div id="active-bank-badge" class="privacy-badge">本地计算</div>
      </div>

      <section id="test-manual" class="mode-panel active">
        <div class="panel-toolbar">
          <strong>三次挑战</strong>
          <button id="regenerate" class="button secondary" type="button" disabled>重新生成</button>
        </div>
        <div id="challenge-list" class="challenge-list" aria-live="polite"></div>
        <div class="action-row"><button id="analyze" class="button primary" type="button" disabled>计算归因概率</button></div>
      </section>

      <div id="test-message" class="message working">正在加载统一指纹库……</div>
      <section id="result" class="result-panel" hidden aria-live="polite"></section>
    </section>
  </main>

  <!-- file-protocol-guard:start -->
  <noscript>
    <div class="file-protocol-guard">
      <strong>需要启用 JavaScript</strong>
      <span>指纹库加载与归因计算都在浏览器本地完成，请允许本页执行 JavaScript 后重试。</span>
    </div>
  </noscript>
  <script>
    (function () {
      if (location.protocol !== "file:") return;
      var notice = document.createElement("div");
      notice.className = "file-protocol-guard";
      notice.innerHTML = '<strong>请勿用 file:// 直接打开本文件</strong>'
        + '<span>浏览器会拦截 file:// 下的 ES 模块与指纹库读取，页面会一直停在“正在加载统一指纹库”。</span>'
        + '<span>请改用在线页面 <a href="https://xqy2006.github.io/ModelTrace/" rel="noopener">xqy2006.github.io/ModelTrace</a>，'
        + '或在项目目录运行 <code>python start.py</code> 后访问 <code>http://127.0.0.1:7860/</code>。</span>';
      var message = document.getElementById("test-message");
      if (message) { message.replaceWith(notice); } else { document.body.appendChild(notice); }
    })();
  </script>
  <style>
    .file-protocol-guard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 880px;
      margin: 24px auto;
      padding: 16px 18px;
      border: 1px solid #d8a13a;
      border-left-width: 4px;
      border-radius: 10px;
      background: #fff6e3;
      color: #5b4310;
      font-size: 14px;
      line-height: 1.65;
    }
    .file-protocol-guard strong { font-size: 15px; }
    .file-protocol-guard code {
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.07);
      font-size: 13px;
    }
  </style>
  <!-- file-protocol-guard:end -->

  <script type="module" src="./pages-app.js"></script>
</body>
</html>

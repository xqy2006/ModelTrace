# 放在 /etc/nginx/conf.d/modeltrace.conf，修改 server_name 后 nginx -t && reload。
# 此文件需由 nginx.conf 的 http {} include；不包含 Node.js / upstream / proxy_pass。
server {
    listen 80;
    server_name _;

    root /var/www/modeltrace/site;
    index index.html;
    include /etc/nginx/mime.types;
    charset utf-8;

    # 带 hash 的构建资源可长期缓存；不存在的资源不能回退为 HTML。
    location /_nuxt/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退，HTML 不长期缓存，避免更新后仍引用旧资源。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}
